services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video_saver}
      POSTGRES_USER: ${POSTGRES_USER:-video_saver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-video_saver}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - downloads:/data/downloads

  bot:
    build: .
    command: python -m app.bot.main
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - downloads:/data/downloads

  worker:
    build: .
    command: python -m app.worker.run
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - downloads:/data/downloads

  cleanup:
    build: .
    command: python -m app.worker.cleanup
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - downloads:/data/downloads

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  downloads:
