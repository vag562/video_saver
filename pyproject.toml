[project]
name = "video-saver"
version = "0.1.0"
description = "Telegram bot and backend for downloading videos with yt-dlp"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "yt-dlp>=2025.1.1",
    "redis>=5,<6",
    "rq>=2,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "asyncpg>=0.29,<1",
    "psycopg2-binary>=2.9,<3",
    "pydantic-settings>=2,<3",
    "python-dotenv>=1,<2",
    "aiofiles>=24,<25",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["ruff>=0.6,<1", "pytest>=8,<9"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
